syntax = "proto3";

package dispatcher.v1;

option go_package = "github.com/gulyaev-iv/go-cloud-des/api/dispatcher/v1;dispatcherv1";

service DispatcherService {
  rpc StartExperiment(StartExperimentRequest) returns (StartExperimentResponse);
  rpc StopExperiment(StopExperimentRequest) returns (StopExperimentResponse);

  rpc GetExperiment(GetExperimentRequest) returns (ExperimentStatus);
  rpc ListExperiments(ListExperimentsRequest) returns (ListExperimentsResponse);
  rpc GetNodeStatus(GetNodeStatusRequest) returns (NodeStatus);
}

message BinaryArtifact {
  string key = 1;
  string sha256 = 2;
}

message ArtifactRef {
  string key = 1;
  string sha256 = 2;
  int64 size = 3;
  string content_type = 4;
}

message SetVar {
  string name = 1;
  string value = 2;
}

message StopRule {
  string left = 1;
  string op = 2;
  string right = 3;
}

message StartExperimentRequest {
  string model_hash = 1;
  string experiment_id = 2;

  BinaryArtifact binary = 3;

  repeated SetVar set_vars = 4;
  StopRule stop_rule = 5;

  repeated string metrics = 6;
  double metric_step = 7;
  bool store_metrics = 8;

  uint64 memory_limit_bytes = 9;
  uint64 run_timeout_ms = 10;
}

message StartExperimentResponse {
  bool accepted = 1;
  string model_hash = 2;
  string experiment_id = 3;
  string status = 4;
  string error_code = 5;
  string message = 6;
}

message StopExperimentRequest {
  string model_hash = 1;
  string experiment_id = 2;
}

message StopExperimentResponse {
  bool stopped = 1;
  string model_hash = 2;
  string experiment_id = 3;
  string status = 4;
  string message = 5;
}

message GetExperimentRequest {
  string model_hash = 1;
  string experiment_id = 2;
}

message ExperimentStatus {
  string model_hash = 1;
  string experiment_id = 2;
  string status = 3;

  string finish_reason = 4;
  int32 exit_code = 5;
  string error_message = 6;

  map<string, string> final_metrics = 7;

  uint64 stat_count = 8;
  uint64 metrics_file_rows = 9;
  ArtifactRef metrics_artifact = 10;

  int64 started_at_unix_ms = 11;
  int64 finished_at_unix_ms = 12;
  int64 duration_ms = 13;

  uint64 memory_limit_bytes = 14;
  uint64 peak_memory_bytes = 15;

  string stderr_tail = 16;
}

message ListExperimentsRequest {
  string status = 1;
}

message ListExperimentsResponse {
  repeated ExperimentStatus experiments = 1;
}

message GetNodeStatusRequest {}

message NodeStatus {
  string node_id = 1;
  string address = 2;

  string runtime_goos = 3;
  string runtime_goarch = 4;

  uint64 total_slots = 5;
  uint64 used_slots = 6;

  uint64 total_memory_bytes = 7;
  uint64 reserved_memory_bytes = 8;

  uint64 active_experiments = 9;
  uint64 cached_models = 10;
}